<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>WALYZITO // GAME '26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #FFE600;
            --cyan: #00F0FF;
            --green: #00FF66;
            --bg-color: #121026;
            --box-bg: #0a0818;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            background-color: var(--bg-color);
            color: #FFF;
            height: 100vh;
            width: 100vw;
            font-family: 'Press Start 2P', 'VT323', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
        }

        .game-container {
            width: 100%;
            height: 100%;
            max-width: 380px;
            max-height: 750px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            border: 2px solid var(--cyan);
            padding: 8px 10px;
            flex-shrink: 0;
            will-change: auto;
        }

        .hud-title {
            font-size: 0.6rem;
            color: var(--yellow);
            letter-spacing: 1px;
        }

        .hud-counter {
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            color: var(--cyan);
        }

        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 12px 0;
            position: relative;
            min-height: 0;
        }

        .frame {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 10px;
            animation: fadeIn 0.15s ease-out;
            will-change: opacity;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .frame.active {
            display: flex;
        }

        .dialog-box {
            width: 100%;
            background: var(--box-bg);
            border: 3px solid var(--yellow);
            padding: 14px 10px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .dialog-text {
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            line-height: 1.2;
            color: #FFF;
            word-break: break-word;
            white-space: pre-wrap;
            width: 100%;
            text-align: left;
            min-height: 3rem;
        }

        .cursor {
            display: inline-block;
            width: 5px;
            height: 1rem;
            background-color: var(--yellow);
            margin-left: 2px;
            animation: blink 0.6s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .card {
            width: 100%;
            background: var(--box-bg);
            border: 3px solid var(--green);
            overflow: hidden;
            will-change: auto;
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }

        .card-info {
            padding: 8px;
            text-align: left;
            background: #000;
            border-top: 2px solid var(--green);
        }

        .card-title {
            font-size: 0.55rem;
            color: var(--yellow);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .card-sub {
            font-family: 'VT323', monospace;
            font-size: 1rem;
            color: #CCC;
            line-height: 1.2;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            flex-shrink: 0;
        }

        .btn {
            width: 100%;
            background: var(--yellow);
            color: #000;
            border: 3px solid #000;
            padding: 12px 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            text-transform: uppercase;
            cursor: pointer;
            font-weight: 400;
            letter-spacing: 0.5px;
            transition: opacity 0.1s;
            will-change: auto;
            -webkit-appearance: none;
            appearance: none;
        }

        .btn:active {
            opacity: 0.85;
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.secondary {
            background: var(--cyan);
        }

        .btn.spotify {
            background: var(--green);
        }

        .icon {
            font-size: 1.2rem;
            line-height: 1;
        }

        /* QR Code específico */
        .qr-frame {
            padding: 16px;
            text-align: center;
            background: #FFF;
            border: 3px solid var(--green);
            width: 100%;
        }

        .qr-frame img {
            width: 140px;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        .qr-label {
            font-family: 'Press Start 2P';
            font-size: 0.45rem;
            color: #000;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Performance otimizado */
        @media (max-width: 480px) {
            .dialog-text {
                font-size: 1.3rem;
            }
            .hud-title {
                font-size: 0.55rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="hud">
            <div class="hud-title">⭐ WALYZITO</div>
            <div class="hud-counter">FRAME <span id="frame-num">01</span>/19</div>
        </div>

        <div class="stage">
            <div class="frame active" id="frame-1">
                <div class="icon">👾</div>
                <div class="dialog-box">
                    <div class="dialog-text" data-text="Eaí, Walyzito... tudo bem?"></div>
                </div>
            </div>

            <div class="frame" id="frame-2">
                <div class="icon">🎂</div>
                <div class="dialog-box">
                    <div class="dialog-text" data-text="Hoje é seu dia, e eu quero te parabenizar por mais um ano de vida."></div>
                </div>
            </div>

            <div class="frame" id="frame-3">
                <div class="dialog-box">
                    <div class="dialog-text" data-text="Mas também quero te dizer o quanto você é especial pra mim..."></div>
                </div>
            </div>

            <div class="frame" id="frame-4">
                <div class="icon">✨</div>
                <div class="dialog-box">
                    <div class="dialog-text" data-text="E como meus dias são muito melhores quando você está neles."></div>
                </div>
            </div>

            <div class="frame" id="frame-5">
                <div class="icon">🎁</div>
                <div class="dialog-box">
                    <div class="dialog-text" data-text="E já que o dia é seu, quero te presentear!"></div>
                </div>
            </div>

            <div class="frame" id="frame-6">
                <div class="dialog-box">
                    <div class="dialog-text" data-text="Você aceita esse presente?"></div>
                </div>
            </div>

            <div class="frame" id="frame-7">
                <div class="icon">🔥</div>
                <div class="dialog-box">
                    <div class="dialog-text" data-text="Prepara as malas: de 20 a 22 de novembro a gente vai juntos pra DunamisCon!"></div>
                </div>
            </div>

            <div class="frame" id="frame-8">
                <div class="icon">✈️</div>
                <div class="dialog-box">
                    <div class="dialog-text" data-text="Saindo na sexta e voltando no domingo, igualzinho quando fomos ao FHOP."></div>
                </div>
            </div>

            <div class="frame" id="frame-9">
                <div class="card">
                    <img src="https://i.ibb.co/60BN9F4B/hotel.jpg" alt="Hotel GoÁtica" loading="lazy">
                    <div class="card-info">
                        <div class="card-title">🏨 GOÁTICA CONGONHAS</div>
                        <div class="card-sub">📍 Campo Belo, SP<br>📅 20-22 Nov 2026<br><br>Nosso canto já tá reservado!</div>
                    </div>
                </div>
            </div>

            <div class="frame" id="frame-10">
                <div class="icon">😉</div>
                <div class="dialog-box">
                    <div class="dialog-text" data-text="Tá tudo pronto... só faltava você saber. 😉"></div>
                </div>
            </div>

            <div class="frame" id="frame-11">
                <div class="dialog-box">
                    <div class="dialog-text" data-text="Gostou? Esse aqui é o seu ingresso:"></div>
                </div>
            </div>

            <div class="frame" id="frame-12">
                <div class="qr-frame">
                    <img src="https://i.ibb.co/k2yH8yJf/qrcode.png" alt="Ingresso" loading="lazy">
                    <div class="qr-label">TICKET #DUNAMIS-WALY-2026</div>
                </div>
            </div>

            <div class="frame" id="frame-13">
                <div class="icon">📱</div>
                <div class="dialog-box">
                    <div class="dialog-text" data-text="Não printou? Não tem problema, tenho cópias."></div>
                </div>
            </div>

            <div class="frame" id="frame-14">
                <div class="dialog-box">
                    <div class="dialog-text" data-text="Sei que você não é muito bom com palavras, mas eu sou ótimo com elas..."></div>
                </div>
            </div>

            <div class="frame" id="frame-15">
                <div class="dialog-box">
                    <div class="dialog-text" data-text="E hoje eu tenho duas pra você:"></div>
                </div>
            </div>

            <div class="frame" id="frame-16">
                <div class="dialog-box">
                    <div class="dialog-text" data-text="Amo você."></div>
                </div>
            </div>

            <div class="frame" id="frame-17">
                <div class="icon">🎈</div>
                <div class="dialog-box">
                    <div class="dialog-text" data-text="Aproveita seu dia :)"></div>
                </div>
            </div>

            <div class="frame" id="frame-18">
                <div class="icon">🎶</div>
                <div class="dialog-box">
                    <div class="dialog-text" data-text="E ó... essa trilha sonora aqui é pra você:"></div>
                </div>
            </div>

            <div class="frame" id="frame-19">
                <a href="https://open.spotify.com/playlist/05QmqLEMqhJQYouLwGRyJS?si=0d291cc2a3ef41eb&pt=d0a7226d11ac5a070245eeadbcd08d91" target="_blank" style="width: 100%;">
                    <button class="btn spotify">▶ OUVIR NO SPOTIFY ❤️</button>
                </a>
            </div>
        </div>

        <div class="actions">
            <button class="btn" id="next-btn">AVANÇAR ▶</button>
            <button class="btn secondary" id="choice-btn" style="display: none;">COM CERTEZA!</button>
        </div>
    </div>

    <script>
        let currentFrame = 1;
        const totalFrames = 19;
        let isTyping = false;
        let typeAnimationId = null;

        function typeWriter(element, text) {
            isTyping = true;
            element.textContent = '';
            let i = 0;
            
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            
            function type() {
                if (i < text.length) {
                    element.textContent = text.substring(0, i + 1);
                    element.appendChild(cursor);
                    i++;
                    typeAnimationId = setTimeout(type, 35);
                } else {
                    isTyping = false;
                }
            }
            type();
        }

        function triggerFrameAnimation(frameNum) {
            const frameEl = document.getElementById(`frame-${frameNum}`);
            if (!frameEl) return;
            
            const textEl = frameEl.querySelector('.dialog-text');
            if (textEl && textEl.hasAttribute('data-text')) {
                const fullText = textEl.getAttribute('data-text');
                typeWriter(textEl, fullText);
            }
        }

        function advanceFrame() {
            if (isTyping) {
                clearTimeout(typeAnimationId);
                const currentFrameEl = document.getElementById(`frame-${currentFrame}`);
                const textEl = currentFrameEl.querySelector('.dialog-text');
                if (textEl && textEl.hasAttribute('data-text')) {
                    textEl.innerHTML = textEl.getAttribute('data-text');
                }
                isTyping = false;
                return;
            }

            if (currentFrame < totalFrames) {
                document.getElementById(`frame-${currentFrame}`).classList.remove('active');
                currentFrame++;
                document.getElementById(`frame-${currentFrame}`).classList.add('active');
                document.getElementById('frame-num').textContent = currentFrame < 10 ? `0${currentFrame}` : currentFrame;
                
                triggerFrameAnimation(currentFrame);

                const mainBtn = document.getElementById('next-btn');
                const secondaryBtn = document.getElementById('choice-btn');

                if (currentFrame === 6) {
                    mainBtn.textContent = 'SIM!';
                    secondaryBtn.style.display = 'block';
                } else if (currentFrame === 7) {
                    mainBtn.textContent = 'AVANÇAR ▶';
                    secondaryBtn.style.display = 'none';
                } else if (currentFrame === 19) {
                    mainBtn.textContent = 'FINALIZAR ✔';
                    secondaryBtn.style.display = 'none';
                    mainBtn.onclick = function() {
                        alert('Partiu DunamisCon 2026! 🚀');
                    };
                } else {
                    secondaryBtn.style.display = 'none';
                }
            }
        }

        document.getElementById('next-btn').addEventListener('click', advanceFrame);
        document.getElementById('choice-btn').addEventListener('click', advanceFrame);

        triggerFrameAnimation(1);
    </script>
</body>
</html>
