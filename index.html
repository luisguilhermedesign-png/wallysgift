<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WALYZITO // GAME '26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-yellow: #FFE600;
            --pixel-orange: #FF6600;
            --pixel-red: #FF2255;
            --pixel-purple: #8800FF;
            --pixel-cyan: #00F0FF;
            --pixel-green: #00FF66;
            --pixel-dark-blue: #0b0c1b;
            --pixel-night-sky: #131236;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            image-rendering: pixelated;
        }

        body {
            background-color: #05050a;
            color: #FFFFFF;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            position: relative;
        }

        /* Fundo Cenário Pixel Art Night Sky */
        .game-world {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #09081a 0%, #171238 50%, #2a164d 80%, #4a195c 100%);
            z-index: 1;
            overflow: hidden;
        }

        /* Lua Pixelada */
        .pixel-moon {
            position: absolute;
            top: 30px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: var(--pixel-yellow);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--pixel-yellow), inset -6px -6px 0px #FFB700;
            animation: moonGlow 3s infinite alternate;
        }

        @keyframes moonGlow {
            from { box-shadow: 0 0 15px var(--pixel-yellow); }
            to { box-shadow: 0 0 30px var(--pixel-yellow); }
        }

        /* Estrelas piscantes */
        .star {
            position: absolute;
            background: #FFF;
            width: 3px;
            height: 3px;
            box-shadow: 0 0 4px #FFF;
            animation: twinkle 1.5s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* Nuvens Pixeladas */
        .pixel-cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 12px 0 0 rgba(255, 255, 255, 0.15), -12px 0 0 rgba(255, 255, 255, 0.15), 0 -8px 0 rgba(255, 255, 255, 0.15);
            height: 16px;
            width: 50px;
            animation: floatCloud 25s linear infinite;
        }

        @keyframes floatCloud {
            from { transform: translateX(-100px); }
            to { transform: translateX(450px); }
        }

        /* Efeito Filtro CRT de TV Antiga */
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 99;
            pointer-events: none;
            opacity: 0.7;
        }

        /* Container Arcade Mobile */
        .arcade-frame {
            width: 100%;
            max-width: 410px;
            height: 100vh;
            max-height: 860px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            position: relative;
            z-index: 10;
        }

        /* HUD Superior Estilo TV Retro */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            border: 3px solid var(--pixel-cyan);
            padding: 10px 12px;
            box-shadow: 4px 4px 0px #000, 0 0 12px var(--pixel-cyan);
        }

        .hud-title {
            font-size: 0.7rem;
            color: var(--pixel-yellow);
            text-shadow: 2px 2px 0px #880000;
        }

        .hud-score {
            font-family: 'VT323', monospace;
            font-size: 1.3rem;
            color: var(--pixel-cyan);
            letter-spacing: 2px;
        }

        /* Área Central do Jogo */
        .game-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 16px 0;
            position: relative;
        }

        .frame {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 16px;
            animation: pixelPop 0.2s steps(3) forwards;
        }

        .frame.active {
            display: flex;
        }

        @keyframes pixelPop {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Caixa de Texto Pixel Art com Efeito 3D */
        .pixel-dialog-box {
            width: 100%;
            background: #0d091a;
            border: 4px solid var(--pixel-yellow);
            box-shadow: 0 0 0 4px #000, 6px 6px 0px #000, inset 0 0 12px rgba(255, 230, 0, 0.2);
            padding: 16px 12px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .typewriter-text {
            font-family: 'VT323', monospace;
            font-size: 1.65rem;
            line-height: 1.3;
            color: #FFF;
            text-shadow: 2px 2px 0px #000;
            width: 100%;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.4rem;
            background-color: var(--pixel-yellow);
            margin-left: 4px;
            animation: blink 0.6s steps(2) infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Molduras de Mídia (Hotel e QR Code) */
        .media-card {
            width: 100%;
            background: #0d091a;
            border: 4px solid var(--pixel-green);
            box-shadow: 0 0 0 4px #000, 6px 6px 0px #000;
            overflow: hidden;
        }

        .media-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .hotel-info {
            padding: 10px;
            text-align: left;
            background: #000;
            border-top: 3px solid var(--pixel-green);
        }

        .hotel-name {
            font-size: 0.65rem;
            color: var(--pixel-yellow);
            margin-bottom: 6px;
            text-shadow: 1px 1px 0px #000;
        }

        .hotel-details {
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            color: #AAA;
            line-height: 1.3;
        }

        /* Botões Estilo Arcade 3D com Borda Retro */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .btn-arcade-3d {
            width: 100%;
            background: var(--pixel-yellow);
            color: #000;
            border: 4px solid #000;
            padding: 16px 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 0px var(--pixel-orange), 0 10px 0px #000, 0 0 10px var(--pixel-yellow);
            position: relative;
            transition: all 0.1s steps(2);
            text-shadow: 1px 1px 0px #FFF;
        }

        .btn-arcade-3d:active {
            top: 6px;
            box-shadow: 0 0px 0px var(--pixel-orange), 0 4px 0px #000;
        }

        .btn-arcade-3d.secondary {
            background: var(--pixel-cyan);
            box-shadow: 0 6px 0px #0099cc, 0 10px 0px #000, 0 0 10px var(--pixel-cyan);
        }

        .btn-arcade-3d.spotify {
            background: var(--pixel-green);
            box-shadow: 0 6px 0px #00aa44, 0 10px 0px #000, 0 0 10px var(--pixel-green);
            color: #000;
        }

        /* Elementos Decorativos Flutuantes no Palco */
        .decor-item {
            position: absolute;
            font-size: 1.4rem;
            animation: bounceDecor 2s infinite ease-in-out alternate;
        }

        @keyframes bounceDecor {
            from { transform: translateY(0px); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <!-- Filtro TV CRT -->
    <div class="crt-overlay"></div>

    <!-- Cenário Noturno Pixel Art -->
    <div class="game-world">
        <div class="pixel-moon"></div>
        <div class="pixel-cloud" style="top: 40px; left: -20px; animation-duration: 22s;"></div>
        <div class="pixel-cloud" style="top: 120px; left: -50px; animation-duration: 32s;"></div>
        
        <!-- Estrelas -->
        <div class="star" style="top: 15%; left: 20%; animation-delay: 0.2s;"></div>
        <div class="star" style="top: 25%; left: 70%; animation-delay: 0.8s;"></div>
        <div class="star" style="top: 40%; left: 15%; animation-delay: 1.1s;"></div>
        <div class="star" style="top: 60%; left: 85%; animation-delay: 0.4s;"></div>
        <div class="star" style="top: 75%; left: 30%; animation-delay: 1.5s;"></div>
    </div>

    <div class="arcade-frame">
        <!-- HUD Superior -->
        <div class="hud-header">
            <div class="hud-title">⭐ WALYZITO</div>
            <div class="hud-score">FRAME <span id="frame-num" style="color: var(--pixel-yellow);">01</span>/19</div>
        </div>

        <!-- Palco do Jogo -->
        <div class="game-screen">

            <!-- Frame 1 -->
            <div class="frame active" id="frame-1">
                <div class="decor-item" style="top: -30px; left: 10%;">👾</div>
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="Eaí, Walyzito... tudo bem?"></div>
                </div>
            </div>

            <!-- Frame 2 -->
            <div class="frame" id="frame-2">
                <div class="decor-item" style="top: -30px; right: 10%;">🎂</div>
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="Hoje é seu dia, e eu quero te parabenizar por mais um ano de vida."></div>
                </div>
            </div>

            <!-- Frame 3 -->
            <div class="frame" id="frame-3">
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="Mas também quero te dizer o quanto você é especial pra mim..."></div>
                </div>
            </div>

            <!-- Frame 4 -->
            <div class="frame" id="frame-4">
                <div class="decor-item" style="top: -30px; left: 10%;">✨</div>
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="E como meus dias são muito melhores quando você está neles."></div>
                </div>
            </div>

            <!-- Frame 5 -->
            <div class="frame" id="frame-5">
                <div class="decor-item" style="top: -30px; right: 10%;">🎁</div>
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="E já que o dia é seu, quero te presentear!"></div>
                </div>
            </div>

            <!-- Frame 6 (A Pergunta) -->
            <div class="frame" id="frame-6">
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="Você aceita esse presente?"></div>
                </div>
            </div>

            <!-- Frame 7 (Revelação da Viagem) -->
            <div class="frame" id="frame-7">
                <div class="decor-item" style="top: -30px; left: 10%;">🔥</div>
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="Prepara as malas: de 20 a 22 de novembro a gente vai juntos pra DunamisCon!"></div>
                </div>
            </div>

            <!-- Frame 8 -->
            <div class="frame" id="frame-8">
                <div class="decor-item" style="top: -30px; right: 10%;">✈️</div>
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="Saindo na sexta e voltando no domingo, igualzinho quando fomos ao FHOP."></div>
                </div>
            </div>

            <!-- Frame 9 (Hotel Card) -->
            <div class="frame" id="frame-9">
                <div class="media-card">
                    <!-- Link Direto ImgBB para a foto do Hotel -->
                    <img src="https://i.ibb.co/60BN9F4B/hotel.jpg" alt="Hotel GoÁtica Aeroporto Congonhas">
                    <div class="hotel-info">
                        <div class="hotel-name">🏨 GOÁTICA CONGONHAS</div>
                        <div class="hotel-details">
                            📍 Campo Belo, São Paulo - SP<br>
                            📅 20 a 22 de Novembro de 2026<br><br>
                            Nosso canto já tá reservado, só esperando chegarmos.
                        </div>
                    </div>
                </div>
            </div>

            <!-- Frame 10 -->
            <div class="frame" id="frame-10">
                <div class="decor-item" style="top: -30px; right: 10%;">😉</div>
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="Tá tudo pronto... só faltava você saber. 😉"></div>
                </div>
            </div>

            <!-- Frame 11 -->
            <div class="frame" id="frame-11">
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="Gostou? Esse aqui é o seu ingresso:"></div>
                </div>
            </div>

            <!-- Frame 12 (QR Code Card) -->
            <div class="frame" id="frame-12">
                <div class="media-card" style="padding: 16px; text-align: center; background: #FFFFFF;">
                    <!-- Link Direto ImgBB para o QR Code -->
                    <img src="https://i.ibb.co/k2yH8yJf/qrcode.png" alt="Ingresso QR Code" style="width: 170px; margin: 0 auto;">
                    <div style="font-family: 'Press Start 2P'; font-size: 0.55rem; color: #000; margin-top: 10px; text-transform: uppercase;">
                        TICKET #DUNAMIS-WALY-2026
                    </div>
                </div>
            </div>

            <!-- Frame 13 -->
            <div class="frame" id="frame-13">
                <div class="decor-item" style="top: -30px; left: 10%;">📱</div>
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="Não printou? Não tem problema, tenho cópias."></div>
                </div>
            </div>

            <!-- Frame 14 -->
            <div class="frame" id="frame-14">
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="Sei que você não é muito bom com palavras, mas eu sou ótimo com elas..."></div>
                </div>
            </div>

            <!-- Frame 15 -->
            <div class="frame" id="frame-15">
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="E hoje eu tenho duas pra você:"></div>
                </div>
            </div>

            <!-- Frame 16 (Amo você - Versão Simples e Discreta) -->
            <div class="frame" id="frame-16">
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="Amo você."></div>
                </div>
            </div>

            <!-- Frame 17 -->
            <div class="frame" id="frame-17">
                <div class="decor-item" style="top: -30px; right: 10%;">🎈</div>
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="Aproveita seu dia :)"></div>
                </div>
            </div>

            <!-- Frame 18 -->
            <div class="frame" id="frame-18">
                <div class="decor-item" style="top: -30px; left: 10%;">🎶</div>
                <div class="pixel-dialog-box">
                    <div class="typewriter-text" data-text="E ó... essa trilha sonora aqui é pra você:"></div>
                </div>
            </div>

            <!-- Frame 19 (Botão do Spotify) -->
            <div class="frame" id="frame-19">
                <div style="width: 100%;">
                    <a href="https://open.spotify.com/playlist/05QmqLEMqhJQYouLwGRyJS?si=0d291cc2a3ef41eb&pt=d0a7226d11ac5a070245eeadbcd08d91" target="_blank" style="text-decoration: none;">
                        <button class="btn-arcade-3d spotify">
                            ▶ OUVIR NO SPOTIFY ❤️
                        </button>
                    </a>
                </div>
            </div>

        </div>

        <!-- Controles Inferiores -->
        <div class="controls">
            <button class="btn-arcade-3d" id="next-btn" onclick="advanceFrame()">
                AVANÇAR ▶
            </button>
            <button class="btn-arcade-3d secondary" id="choice-btn-2" onclick="advanceFrame()" style="display: none;">
                COM CERTEZA!
            </button>
        </div>
    </div>

    <script>
        let currentFrame = 1;
        const totalFrames = 19;
        let isTyping = false;
        let typeTimeout;

        function typeWriter(element, text, speed = 35) {
            isTyping = true;
            element.innerHTML = '';
            let i = 0;
            
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            
            function type() {
                if (i < text.length) {
                    element.innerHTML = text.substring(0, i + 1);
                    element.appendChild(cursor);
                    i++;
                    typeTimeout = setTimeout(type, speed);
                } else {
                    isTyping = false;
                }
            }
            type();
        }

        function triggerFrameAnimation(frameNum) {
            const frameEl = document.getElementById(`frame-${frameNum}`);
            if (!frameEl) return;
            const textEl = frameEl.querySelector('.typewriter-text');
            
            if (textEl) {
                const fullText = textEl.getAttribute('data-text');
                if (fullText) {
                    typeWriter(textEl, fullText);
                }
            }
        }

        function advanceFrame() {
            if (isTyping) {
                clearTimeout(typeTimeout);
                const currentFrameEl = document.getElementById(`frame-${currentFrame}`);
                const textEl = currentFrameEl.querySelector('.typewriter-text');
                if (textEl) {
                    textEl.innerHTML = textEl.getAttribute('data-text');
                }
                isTyping = false;
                return;
            }

            if (currentFrame < totalFrames) {
                document.getElementById(`frame-${currentFrame}`).classList.remove('active');
                
                currentFrame++;
                
                const nextFrameEl = document.getElementById(`frame-${currentFrame}`);
                nextFrameEl.classList.add('active');
                
                document.getElementById('frame-num').innerText = currentFrame < 10 ? `0${currentFrame}` : currentFrame;
                
                triggerFrameAnimation(currentFrame);

                const mainBtn = document.getElementById('next-btn');
                const secondaryBtn = document.getElementById('choice-btn-2');

                if (currentFrame === 6) {
                    mainBtn.innerText = 'SIM!';
                    secondaryBtn.style.display = 'block';
                } else if (currentFrame === 7) {
                    mainBtn.innerText = 'AVANÇAR ▶';
                    secondaryBtn.style.display = 'none';
                } else if (currentFrame === 19) {
                    mainBtn.innerText = 'FINALIZAR ✔';
                    secondaryBtn.style.display = 'none';
                    mainBtn.onclick = function() {
                        alert('Partiu DunamisCon 2026!');
                    };
                } else {
                    secondaryBtn.style.display = 'none';
                }
            }
        }

        window.onload = () => {
            triggerFrameAnimation(1);
        };
    </script>
</body>
</html>
